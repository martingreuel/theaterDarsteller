<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bildansicht</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="detail">
  <main class="detail-wrap">
    <a class="back-link" href="index.html">← Zurück zur Übersicht</a>
    <img id="detail-image" class="detail-image" src="assets/platzhalter-detail.svg" alt="Ausgewähltes Bild">
  </main>
  <script>
    // Die Bilddatei wird anhand des Parameters ?bild=... ausgewählt.
    // Hier können später die tatsächlichen Dateinamen eingetragen werden.
    const bilder = {
      "bild-01": "assets/detail-01_text.jpg",
      "bild-02": "assets/detail-02_text.jpg",
      "bild-03": "assets/detail-03_text.jpg",
      "bild-04": "assets/detail-04_text.jpg",
      "bild-05": "assets/detail-05_text.jpg",
      "bild-06": "assets/detail-06_text.jpg",
      "bild-07": "assets/detail-07_text.jpg",
      "bild-08": "assets/detail-08_text.jpg",
      "bild-09": "assets/detail-09_text.jpg",
      "bild-10": "assets/detail-10_text.jpg",
      "bild-11": "assets/detail-11_text.jpg",
      "bild-12": "assets/detail-12.jpg"
    };
    const id = new URLSearchParams(window.location.search).get("bild");
    const image = document.getElementById("detail-image");
    if (id && bilder[id]) {
      image.src = bilder[id];
      image.alt = "Detailansicht " + id.replace("-", " ");
      image.onerror = () => {
        image.onerror = null;
        image.src = "assets/platzhalter-detail.svg";
      };
    }
  </script>
</body>
</html>
